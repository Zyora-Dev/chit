name: Build zChit Agent Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-zchit-agent-android.yml"

concurrency:
  group: zchit-agent-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Validate production API URL
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "Set the GitHub repository variable EXPO_PUBLIC_API_URL before building."
            exit 1
          fi
          case "$EXPO_PUBLIC_API_URL" in
            http://*|https://*) ;;
            *) echo "EXPO_PUBLIC_API_URL must begin with http:// or https://"; exit 1 ;;
          esac

      - name: Type-check Agent app
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload zChit Agent APK
        uses: actions/upload-artifact@v4
        with:
          name: zChit-Agent-Android-APK
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30