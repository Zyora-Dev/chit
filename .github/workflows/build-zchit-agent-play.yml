name: Build zChit Agent Google Play Bundle

on:
  workflow_dispatch:

concurrency:
  group: zchit-agent-play-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-aab:
    name: Build signed Agent AAB
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      ZCHIT_OWNER_KEYSTORE_PASSWORD: ${{ secrets.ZCHIT_OWNER_KEYSTORE_PASSWORD }}
      ZCHIT_OWNER_KEY_ALIAS: ${{ secrets.ZCHIT_OWNER_KEY_ALIAS }}
      ZCHIT_OWNER_KEY_PASSWORD: ${{ secrets.ZCHIT_OWNER_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      - name: Validate release configuration
        env:
          ZCHIT_OWNER_KEYSTORE_BASE64: ${{ secrets.ZCHIT_OWNER_KEYSTORE_BASE64 }}
        run: |
          case "$EXPO_PUBLIC_API_URL" in
            https://*) ;;
            *) echo "EXPO_PUBLIC_API_URL must use HTTPS for Play builds"; exit 1 ;;
          esac
          test -n "$ZCHIT_OWNER_KEYSTORE_BASE64"
          test -n "$ZCHIT_OWNER_KEYSTORE_PASSWORD"
          test -n "$ZCHIT_OWNER_KEY_ALIAS"
          test -n "$ZCHIT_OWNER_KEY_PASSWORD"

      - name: Restore Play upload keystore
        env:
          ZCHIT_OWNER_KEYSTORE_BASE64: ${{ secrets.ZCHIT_OWNER_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ZCHIT_OWNER_KEYSTORE_BASE64" | base64 --decode > agent-upload.jks
          chmod 600 agent-upload.jks

      - name: Verify exact Agent artwork
        run: |
          test "$(sha256sum assets/zchit-agent.png | cut -d ' ' -f 1)" = "6bf70303e019aea223a5555c135dd88ccfbe0fe4a1dd85ca8b9ef2b4a13b7c45"

      - name: Type-check Agent app
        run: npx tsc --noEmit

      - name: Generate signed Android project
        env:
          ZCHIT_OWNER_KEYSTORE_PATH: ${{ github.workspace }}/mobile/agent-upload.jks
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build signed Agent bundle
        working-directory: mobile/android
        env:
          ZCHIT_OWNER_KEYSTORE_PATH: ${{ github.workspace }}/mobile/agent-upload.jks
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify bundle signature
        run: jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload zChit Agent AAB
        uses: actions/upload-artifact@v4
        with:
          name: zChit-Agent-Google-Play-AAB
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30